server:
  port: 8080

spring:
  application:
    name: mdd-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mdd}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

mdd:
  jwt:
    jwtSecret: ${JWT_SECRET}
    jwtExpiration: 24

  cors:
    allowed-origins: http://localhost:4200



